<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Owner - Key Generator</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
  body {
    background: #090f1e; color: #eef4ff; display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 20px;
    background-image: radial-gradient(circle at top right, rgba(59,130,246,0.15), transparent 40%),
                      radial-gradient(circle at bottom left, rgba(34,211,238,0.1), transparent 40%);
  }
  .card {
    background: rgba(15, 25, 45, 0.8); backdrop-filter: blur(12px);
    border: 1px solid rgba(59,130,246,0.3); border-radius: 16px;
    padding: 30px; width: 100%; max-width: 480px; /* Agak dilebarin dikit */
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  h2 { text-align: center; color: #60a5fa; margin-bottom: 20px; font-size: 20px; }
  .form-group { margin-bottom: 15px; }
  label { display: block; font-size: 12px; color: #8b98b5; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
  input, select {
    width: 100%; padding: 12px; background: rgba(59,130,246,0.08);
    border: 1px solid rgba(59,130,246,0.3); border-radius: 8px;
    color: #eef4ff; font-size: 14px; outline: none; transition: 0.2s;
  }
  input:focus, select:focus { border-color: #60a5fa; background: rgba(59,130,246,0.15); }
  select option { background: #090f1e; color: #eef4ff; }
  .row { display: flex; gap: 10px; }
  .row .form-group { flex: 1; }
  button {
    width: 100%; padding: 14px; margin-top: 15px; border: none; border-radius: 8px;
    background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: #fff;
    font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.3s;
    box-shadow: 0 4px 15px rgba(59,130,246,0.4);
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59,130,246,0.6); }
  .result-box {
    margin-top: 20px; padding: 15px; background: rgba(34,197,94,0.1);
    border: 1px solid rgba(34,197,94,0.3); border-radius: 8px;
    display: none; word-break: break-all;
  }
  .result-box.error { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: #ef4444; }
  .token-text { font-family: monospace; font-size: 13px; color: #22c55e; margin: 10px 0; line-height: 1.5; user-select: all; }
  .copy-btn {
    background: #22c55e; color: #000; padding: 8px 12px; border-radius: 6px;
    font-size: 12px; font-weight: bold; cursor: pointer; border: none; width: auto; margin-top: 5px;
  }
  .copy-btn:hover { background: #1ea34b; }
</style>
</head>
<body>

<div class="card">
  <h2>🔑 Owner Key Generator</h2>
  
  <div class="form-group">
    <label>Owner Password</label>
    <input type="password" id="ownerPass" placeholder="Masukkan OWNER_PASS Netlify">
  </div>

  <!-- INI BAGIAN YANG DIGANTI: DROPDOWN UNTUK MEMILIH FITUR -->
  <div class="form-group">
    <label>Pilih Fitur (Tipe Key)</label>
    <select id="keyType" style="font-weight: bold; color: #60a5fa;">
      <option value="premium_magic">Fitur Atas (Magic Link / Email)</option>
      <option value="premium_bulk">Fitur Bawah (Bulk Generate)</option>
    </select>
  </div>

  <div class="row">
    <div class="form-group">
      <label>Durasi Angka</label>
      <input type="number" id="amount" value="1" min="1">
    </div>
    <div class="form-group">
      <label>Satuan Waktu</label>
      <select id="unit">
        <option value="second">Detik</option>
        <option value="minute">Menit</option>
        <option value="hour" selected>Jam</option>
        <option value="day">Hari</option>
        <option value="week">Minggu</option>
        <option value="month">Bulan</option>
        <option value="year">Tahun</option>
        <option value="permanent">Permanen</option>
      </select>
    </div>
  </div>

  <button id="generateBtn">Generate Key</button>

  <div class="result-box" id="resultBox">
    <div style="font-size:12px; color:#eef4ff;" id="resultDesc"></div>
    <div class="token-text" id="tokenText"></div>
    <button class="copy-btn" id="copyBtn">Copy Key</button>
  </div>
</div>

<script>
  // Pastikan URL ini pakai domain Netlify lo
  const API_URL = 'https://febztzy-amprem.netlify.app/.netlify/functions/am-admin';
  
  const btn = document.getElementById('generateBtn');
  const box = document.getElementById('resultBox');
  const desc = document.getElementById('resultDesc');
  const tokenTxt = document.getElementById('tokenText');
  const copyBtn = document.getElementById('copyBtn');

  btn.onclick = async () => {
    const ownerPass = document.getElementById('ownerPass').value.trim();
    const amount = Number(document.getElementById('amount').value);
    const unit = document.getElementById('unit').value;
    const plan = document.getElementById('keyType').value;

    if (!ownerPass) return alert('Masukkan Owner Password!');
    if (!amount || amount < 1) return alert('Masukkan durasi yang valid!');

    btn.disabled = true;
    btn.textContent = 'Memproses...';
    box.style.display = 'none';

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          ownerPass: ownerPass,
          action: 'create',
          plan: plan, 
          unit: unit,
          amount: amount
        })
      });

      const data = await res.json();

      if (data.ok) {
        box.className = 'result-box';
        box.style.display = 'block';
        const expDate = new Date(data.expiresAt).toLocaleString('id-ID');
        const fiturName = plan === 'premium_magic' ? 'Fitur Atas' : 'Fitur Bulk';
        
        desc.innerHTML = `Key berhasil dibuat untuk: <b style="color:#60a5fa;">${fiturName}</b><br>Expired: <b>${expDate}</b>`;
        tokenTxt.textContent = data.token;
        copyBtn.style.display = 'block';
      } else {
        throw new Error(data.error || 'Gagal generate key');
      }
    } catch (e) {
      box.className = 'result-box error';
      box.style.display = 'block';
      desc.textContent = '❌ ' + e.message;
      tokenTxt.textContent = '';
      copyBtn.style.display = 'none';
    }

    btn.disabled = false;
    btn.textContent = 'Generate Key';
  };

  copyBtn.onclick = () => {
    navigator.clipboard.writeText(tokenTxt.textContent);
    copyBtn.textContent = 'Tercopy!';
    setTimeout(() => { copyBtn.textContent = 'Copy Key'; }, 2000);
  };
</script>
</body>
</html>

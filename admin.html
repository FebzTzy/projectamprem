<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>AM Owner — Key Manager</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{font-family:system-ui,sans-serif;background:#0a0f1c;color:#eef4ff;padding:24px;max-width:820px;margin:auto}
  h1{font-size:18px;margin-bottom:8px}
  h2{font-size:14px;margin:24px 0 10px;color:#60a5fa}
  label{display:block;font-size:11px;color:#8b98b5;margin:8px 0 4px;text-transform:uppercase;letter-spacing:.6px}
  input,select,button{font-family:inherit;font-size:13px}
  input,select{width:100%;padding:10px;border-radius:10px;border:1px solid rgba(59,130,246,.3);background:rgba(59,130,246,.06);color:#eef4ff}
  button{padding:10px 16px;border:none;border-radius:10px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);color:#fff;font-weight:700;cursor:pointer;margin-top:10px}
  button.secondary{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#3a2600}
  button.danger{background:linear-gradient(135deg,#ef4444,#b91c1c)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .result{margin-top:16px;padding:12px;border-radius:10px;background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.25);word-break:break-all;font-family:monospace;font-size:11px;white-space:pre-wrap}
  table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
  th,td{padding:8px;text-align:left;border-bottom:1px solid rgba(59,130,246,.15)}
  th{color:#8b98b5;font-weight:600;text-transform:uppercase;font-size:10px;letter-spacing:.6px}
  code{font-family:monospace;font-size:11px}
  .copy{background:none;border:1px solid rgba(59,130,246,.3);padding:4px 8px;border-radius:6px;color:#60a5fa;font-size:10px;cursor:pointer}
</style>
</head>
<body>

<h1>🔑 Alight Motion — Owner Key Manager</h1>
<p style="color:#8b98b5;font-size:12px;">Buat, lihat, dan cabut token premium. Semua request ditandatangani server-side.</p>

<label>Owner Password</label>
<input type="password" id="ownerPass" placeholder="Password owner">

<h2>Create Token</h2>
<div class="row">
  <div>
    <label>Plan Name</label>
    <input id="plan" value="premium">
  </div>
  <div>
    <label>Unit</label>
    <select id="unit">
      <option value="second">Detik</option>
      <option value="minute">Menit</option>
      <option value="hour" selected>Jam</option>
      <option value="day">Hari</option>
      <option value="week">Minggu</option>
      <option value="month">Bulan (30 hari)</option>
      <option value="year">Tahun (365 hari)</option>
      <option value="permanent">Permanen</option>
    </select>
  </div>
</div>
<label>Amount</label>
<input type="number" id="amount" value="24" min="1">
<button id="createBtn">Generate Token</button>
<div class="result" id="createResult" style="display:none"></div>

<h2>Active Tokens</h2>
<button id="listBtn" class="secondary">Refresh List</button>
<div id="listTable"></div>

<script>
const API = '/.netlify/functions/am-admin';
const $ = id => document.getElementById(id);

async function adminCall(payload) {
  const ownerPass = $('ownerPass').value.trim();
  if (!ownerPass) throw new Error('Masukkan owner password dulu');
  const r = await fetch(API, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ownerPass, ...payload })
  });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || 'HTTP ' + r.status);
  return data;
}

$('createBtn').onclick = async () => {
  const res = $('createResult');
  res.style.display = 'block';
  res.textContent = 'Generating...';
  try {
    const out = await adminCall({
      action: 'create',
      plan:   $('plan').value.trim() || 'premium',
      unit:   $('unit').value,
      amount: Number($('amount').value)
    });
    const expDate = new Date(out.expiresAt).toLocaleString('id-ID');
    res.textContent = `id: ${out.id}\nplan: ${out.plan}\nunit: ${out.amount} ${out.unit}\nexpiresAt: ${expDate}\n\nTOKEN:\n${out.token}`;
  } catch (e) { res.textContent = '❌ ' + e.message; }
};

$('listBtn').onclick = async () => {
  const wrap = $('listTable');
  wrap.innerHTML = 'Loading...';
  try {
    const out = await adminCall({ action: 'list' });
    const rows = out.keys.map(k => {
      const exp = new Date(k.expiresAt).toLocaleString('id-ID');
      const expShort = k.token.slice(0, 14) + '…';
      return `<tr>
        <td><code>${k.id}</code></td>
        <td>${k.plan}</td>
        <td>${k.amount} ${k.unit}</td>
        <td>${exp}</td>
        <td><code>${expShort}</code> <button class="copy" data-token="${k.token}">copy</button></td>
        <td><button class="copy danger" data-revoke="${k.id}">revoke</button></td>
      </tr>`;
    }).join('');
    wrap.innerHTML = `<table>
      <thead><tr><th>ID</th><th>Plan</th><th>Duration</th><th>Expires</th><th>Token</th><th></th></tr></thead>
      <tbody>${rows || '<tr><td colspan="6" style="color:#8b98b5">Belum ada key</td></tr>'}</tbody>
    </table>`;
    wrap.querySelectorAll('button[data-token]').forEach(b => {
      b.onclick = () => { navigator.clipboard.writeText(b.dataset.token); b.textContent = 'copied'; };
    });
    wrap.querySelectorAll('button[data-revoke]').forEach(b => {
      b.onclick = async () => {
        if (!confirm('Revoke key ' + b.dataset.revoke + '?')) return;
        try {
          await adminCall({ action: 'revoke', id: b.dataset.revoke });
          b.textContent = 'revoked';
          b.disabled = true;
        } catch (e) { alert('❌ ' + e.message); }
      };
    });
  } catch (e) { wrap.innerHTML = '❌ ' + e.message; }
};
</script>
</body>
</html>
